<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="elephantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Base background rounded tile -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  
  <!-- Subtle decorative traditional Thai floral ring -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="#6366f1" stroke-width="4" stroke-dasharray="12 12" opacity="0.45"/>
  
  <!-- Thai Elephant Figure (Chang) with raised trunk and decorative blanket -->
  <g filter="url(#cardShadow)">
    <!-- Elephant Main Body & Legs & Head & Raised Trunk -->
    <!-- Stylized modern elephant geometry -->
    <path d="M 330 380 
             L 330 310 
             C 330 300, 340 290, 360 290 
             L 380 290 
             C 385 290, 390 295, 390 300 
             L 390 380 
             L 360 380 
             L 360 330 
             L 350 330 
             L 350 380 
             Z" fill="#e2e8f0" />

    <!-- Big Elephant Body & Crown & Trunk -->
    <path d="M 170 380 
             L 170 310 
             C 170 240, 200 180, 260 170 
             C 290 165, 330 170, 360 195 
             C 380 210, 390 235, 385 260 
             C 380 280, 360 295, 335 295 
             L 280 295 
             C 270 295, 260 305, 260 315 
             L 260 380 
             L 230 380 
             L 230 330 
             L 200 330 
             L 200 380 
             Z" fill="url(#elephantGrad)" />

    <!-- Elephant Head, Ear and Curved Trunk -->
    <!-- Head circle and high trunk curving upward gracefully -->
    <path d="M 230 230 
             C 210 200, 180 180, 145 190 
             C 120 198, 100 220, 100 250 
             C 100 290, 125 325, 155 330 
             C 165 332, 175 325, 175 315 
             C 175 305, 168 298, 160 295 
             C 140 290, 125 270, 125 250 
             C 125 235, 138 220, 155 218 
             C 175 215, 195 230, 210 255 
             Z" fill="#cbd5e1" />

    <!-- Front Elephant Head & Trunk extending forward and up -->
    <path d="M 220 190 
             C 210 160, 185 140, 160 145 
             C 140 149, 130 165, 135 180 
             C 140 192, 155 195, 165 190 
             C 175 185, 180 170, 172 162 
             C 175 160, 182 162, 188 170 
             C 198 182, 202 205, 195 230 
             C 190 250, 182 275, 178 295 
             C 172 325, 195 345, 215 345 
             C 225 345, 235 335, 235 320 
             C 235 300, 240 270, 250 240 
             C 255 220, 250 200, 235 190 
             Z" fill="url(#elephantGrad)" />

    <!-- Majestic Tusk (ivory gold-tipped) -->
    <path d="M 225 275 
             C 240 290, 265 295, 280 280 
             C 285 275, 282 270, 275 272 
             C 260 278, 245 275, 232 265 
             Z" fill="url(#goldGrad)" />

    <!-- Friendly Elephant Eye -->
    <circle cx="215" cy="210" r="5" fill="#312e81" />
    <circle cx="213" cy="208" r="1.5" fill="#ffffff" />

    <!-- Traditional Thai Ceremonial Howdah / Blanket on Elephant's Back -->
    <path d="M 255 180 
             C 280 180, 310 185, 325 195 
             L 320 250 
             C 295 260, 280 260, 255 250 
             Z" fill="url(#goldGrad)" />
             
    <!-- Traditional Diamond Emblem inside saddle blanket -->
    <polygon points="288,205 300,220 288,235 276,220" fill="#ffffff" opacity="0.9" />
    <circle cx="288" cy="220" r="3.5" fill="#d97706" />
  </g>
  
  <!-- Thai Star Accents -->
  <g fill="url(#goldGrad)">
    <!-- 4-point sparkle top right -->
    <path d="M 390 130 Q 390 145 375 145 Q 390 145 390 160 Q 390 145 405 145 Q 390 145 390 130 Z" />
    <path d="M 120 120 Q 120 130 110 130 Q 120 130 120 140 Q 120 130 130 130 Q 120 130 120 120 Z" opacity="0.8" />
  </g>
</svg>
