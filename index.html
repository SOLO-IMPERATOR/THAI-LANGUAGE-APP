<!doctype html>
<html lang="ru">
  <head>
    <script>
      (function () {
        if (typeof window === 'undefined') return;
        // Suppress unhandled promise rejections from benign Vite client websocket attempts
        window.addEventListener('unhandledrejection', function (event) {
          const reason = String(event.reason || '');
          if (reason.includes('websocket') || reason.includes('WebSocket') || reason.includes('[vite]')) {
            event.preventDefault();
          }
        });
        // Filter out benign [vite] websocket connection failure logs
        const origConsoleError = console.error;
        console.error = function (...args) {
          const firstArg = args[0] != null ? String(args[0]) : '';
          if (
            firstArg.includes('[vite] failed to connect to websocket') ||
            (firstArg.includes('[vite]') && (firstArg.includes('websocket') || firstArg.includes('WebSocket')))
          ) {
            return;
          }
          origConsoleError.apply(console, args);
        };
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Тайский фразовик</title>
    <meta name="description" content="Тренажер разговорного тайского языка с практической русской транскрипцией, интервальным повторением SRS и проверкой произношения." />
    <meta property="og:title" content="Тайский фразовик" />
    <meta property="og:description" content="Тренажер разговорного тайского языка с практической русской транскрипцией, интервальным повторением SRS и проверкой произношения." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Тайский фразовик" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body class="bg-[#f8fafc] text-slate-900 min-h-screen antialiased selection:bg-indigo-500/20 selection:text-indigo-900 font-sans">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
